name: Build and Publish App (Windows EXE & Android APK)

on:
  push:
    paths:
      - 'test.py'
  workflow_dispatch:          # 支持在 GitHub 网页上手动点击“立即打包”

jobs:
  # ==========================================
  # 1. 打包 Windows EXE (适配新版 Flet 隐藏依赖)
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flet flet-desktop

      - name: Build Windows EXE
        run: |
          pyinstaller --noconsole --onefile --hidden-import=flet_desktop --hidden-import=flet.canvas --name="EncryptionTool_Win" test.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EncryptionTool_Windows_EXE
          path: dist/EncryptionTool_Win.exe

  # ==========================================
  # 2. 打包 Android APK (基于 Flutter & Flet CLI)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Flet CLI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-desktop

      - name: Build Android APK
        run: |
          flet build apk --verbose

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EncryptionTool_Android_APK
          path: build/apk/*.apk

  # ==========================================
  # 3. 自动发布到 GitHub Releases 页面
  # ==========================================
  publish-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: EncryptionTool_Windows_EXE
          path: release_files/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: EncryptionTool_Android_APK
          path: release_files/

      - name: Generate Dynamic Release Tag
        id: tag_name
        run: |
          TAG="v1.0.$(date +'%Y%m%d%H%M%S')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: "任意字符/歌词密钥加解密工具 (${{ steps.tag_name.outputs.tag }})"
          body: |
            🎉 **云端自动打包完成！**
            
            包含以下最新编译出的无依赖安装包：
            - 💻 **Windows 端**: `EncryptionTool_Win.exe` (已包含全套桌面渲染组件)
            - 📱 **Android 端**: `.apk`
          draft: false
          prerelease: false
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
